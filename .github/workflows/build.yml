name: Build AzyOpt & AzyIstatik (from zip)

on:
  push:
    branches: [ "main" ]
    paths:
      - "azyopt-plugin.zip"
      - "azyistatik-plugin.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build AzyOpt
        if: hashFiles('azyopt-plugin.zip') != ''
        run: |
          mkdir -p extracted-azyopt
          unzip -o azyopt-plugin.zip -d extracted-azyopt
          POM_DIR=$(dirname "$(find extracted-azyopt -maxdepth 3 -name pom.xml | head -n 1)")
          echo "AZYOPT_DIR=$POM_DIR" >> "$GITHUB_ENV"
          cd "$POM_DIR" && mvn -B clean package

      - name: Build AzyIstatik
        if: hashFiles('azyistatik-plugin.zip') != ''
        run: |
          mkdir -p extracted-azyistatik
          unzip -o azyistatik-plugin.zip -d extracted-azyistatik
          POM_DIR=$(dirname "$(find extracted-azyistatik -maxdepth 3 -name pom.xml | head -n 1)")
          echo "AZYISTATIK_DIR=$POM_DIR" >> "$GITHUB_ENV"
          cd "$POM_DIR" && mvn -B clean package

      - name: Upload AzyOpt jar
        if: env.AZYOPT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: AzyOpt
          path: ${{ env.AZYOPT_DIR }}/target/AzyOpt-*.jar

      - name: Upload AzyIstatik jar
        if: env.AZYISTATIK_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: AzyIstatik
          path: ${{ env.AZYISTATIK_DIR }}/target/AzyIstatik-*.jar
