name: Build AzyBountyGUI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip dosyasını aç (varsa)
        run: |
          if [ -f "AzyBountyGUI-source.zip" ]; then
            unzip -o AzyBountyGUI-source.zip -d .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -f AzyBountyGUI/pom.xml

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: AzyBountyGUI
          path: AzyBountyGUI/target/AzyBountyGUI.jar
